name: assemble-slices
on:
  push:
    paths:
      - ".github/slice-manifest.json"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate slice chunks
        run: |
          python3 - << 'PY'
          import hashlib
          import json
          from pathlib import Path
          def piece(c):
              if isinstance(c, str):
                  return Path(c).read_text()
              if "file" not in c:
                  return c["fill"] * c["n"]
              data = Path(c["file"]).read_text()
              n = c.get("n")
              if n is None:
                  return data
              pad = c.get("pad", "")
              if len(data) > n:
                  raise SystemExit(f"piece too long {c['file']} {len(data)}>{n}")
              gap = pad * (n - len(data))
              if len(gap) != n - len(data):
                  raise SystemExit("pad does not tile")
              if c.get("side") == "start":
                  return gap + data
              return data + gap
          manifest = json.loads(Path(".github/slice-manifest.json").read_text())
          if isinstance(manifest, list):
              files = list(manifest)
          else:
              files = list(manifest.get("files", []))
              for inc in manifest.get("includes", []):
                  extra = json.loads(Path(inc).read_text())
                  if isinstance(extra, list):
                      files.extend(extra)
                  elif isinstance(extra, dict) and "chunks" in extra:
                      files.append(extra)
                  else:
                      files.extend(extra.get("files", []))
          for item in files:
              data = "".join(piece(c) for c in item["chunks"])
              dest = Path(item["path"])
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_text(data)
              got = dest.stat().st_size
              if got != item["size"]:
                  raise SystemExit(f"size mismatch {item['path']} {got} != {item['size']}")
              if "sha256" in item:
                  h = hashlib.sha256(dest.read_bytes()).hexdigest()
                  if h != item["sha256"]:
                      raise SystemExit(f"hash mismatch {item['path']} {h} != {item['sha256']}")
          if isinstance(manifest, dict):
              for item in manifest.get("repairs", []):
                  dest = Path(item["path"])
                  data = bytearray(dest.read_bytes())
                  off = item["offset"]
                  old = item["old"].encode()
                  new = item["new"].encode()
                  cur = bytes(data[off:off+len(old)])
                  if cur == new:
                      pass
                  elif cur == old:
                      data[off:off+len(old)] = new
                  else:
                      raise SystemExit(f"repair precondition {item['path']} @{off} got {cur!r}")
                  dest.write_bytes(data)
                  if dest.stat().st_size != item["size"]:
                      raise SystemExit(f"size mismatch {item['path']}")
                  if "sha256" in item:
                      h = hashlib.sha256(dest.read_bytes()).hexdigest()
                      if h != item["sha256"]:
                          raise SystemExit(f"hash mismatch {item['path']} {h} != {item['sha256']}")
          PY
      - name: Commit assembled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-parts
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Assemble PolySpire slice files"
            git push
          fi
