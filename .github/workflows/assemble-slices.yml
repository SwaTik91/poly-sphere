name: assemble-slices
on:
  push:
    paths:
      - ".github/slice-manifest.json"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate slice chunks
        run: |
          python3 - << 'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path(".github/slice-manifest.json").read_text())
          for item in manifest:
              data = "".join(Path(p).read_text() for p in item["chunks"])
              dest = Path(item["path"])
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_text(data)
              got = dest.stat().st_size
              if got != item["size"]:
                  raise SystemExit(f"size mismatch {item['path']} {got} != {item['size']}")
          PY
      - name: Commit assembled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-parts
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Assemble PolySpire slice files"
            git push
          fi
